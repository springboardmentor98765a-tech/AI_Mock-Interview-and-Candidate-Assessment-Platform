spring.application.name=smarthire-backend
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smarthire}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

# Resume upload configuration
app.upload.dir=uploads/resumes

# Max file size (PDF resumes)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Google Gemini API configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=gemini-2.0-flash
gemini.timeout.connect=10
gemini.timeout.read=30

# Frontend integration
app.cors.allowed-origins=*
app.jwt.secret=${APP_JWT_SECRET:smarthire-secret-key-smarthire-secret-key-123456}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# AI Provider configuration
ai.deepface.url=${AI_DEEPFACE_URL:}
ai.deepface.enabled=${AI_DEEPFACE_ENABLED:false}
ai.mediapipe.url=${AI_MEDIAPIPE_URL:}
ai.mediapipe.enabled=${AI_MEDIAPIPE_ENABLED:false}

# SMTP Email configuration
mail.smtp.host=${MAIL_SMTP_HOST:}
mail.smtp.port=${MAIL_SMTP_PORT:587}
mail.smtp.username=${MAIL_SMTP_USERNAME:}
mail.smtp.password=${MAIL_SMTP_PASSWORD:}
mail.smtp.auth=${MAIL_SMTP_AUTH:false}
mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
mail.from=${MAIL_FROM:smarthire@localhost}

# Profile image upload
app.profile.upload.dir=uploads/profiles
