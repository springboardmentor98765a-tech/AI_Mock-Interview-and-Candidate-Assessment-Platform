spring.application.name=smarthire-backend
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/smarthire}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:pgAdmin4}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

server.port=8080

# Resume upload configuration
app.upload.dir=uploads/resumes

# Max file size (PDF resumes and interview video/audio recordings share this limit)
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# Interview recording storage (Module 4). "local" writes under app.recording.storage.dir,
# which is never served publicly - access always goes through the authorized
# /api/interview-sessions/{id}/recording/** endpoints. Swap to a future s3/azure
# provider by adding a new RecordingStorageService implementation.
app.recording.storage.provider=local
app.recording.storage.dir=uploads/recordings

# Google Gemini API configuration
gemini.api.key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.6-flash}
gemini.timeout.connect=10
gemini.timeout.read=${GEMINI_READ_TIMEOUT_SECONDS:3}

# Frontend integration
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://127.0.0.1:5500,http://localhost:5500,http://localhost:5173}
app.jwt.secret=${APP_JWT_SECRET:smarthire-secret-key-smarthire-secret-key-123456}
app.jwt.expiration-ms=${APP_JWT_EXPIRATION_MS:86400000}

# AI Provider configuration
ai.deepface.url=${AI_DEEPFACE_URL:}
ai.deepface.enabled=${AI_DEEPFACE_ENABLED:false}
ai.mediapipe.url=${AI_MEDIAPIPE_URL:}
ai.mediapipe.enabled=${AI_MEDIAPIPE_ENABLED:false}

# SMTP Email configuration
mail.smtp.host=${MAIL_SMTP_HOST:}
mail.smtp.port=${MAIL_SMTP_PORT:587}
mail.smtp.username=${MAIL_SMTP_USERNAME:}
mail.smtp.password=${MAIL_SMTP_PASSWORD:}
mail.smtp.auth=${MAIL_SMTP_AUTH:false}
mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:true}
mail.from=${MAIL_FROM:smarthire@localhost}

# Profile image upload
app.profile.upload.dir=uploads/profiles

# AI question generation is optional; database fallback keeps interviews available during Gemini outages.
gemini.question-generation.enabled=${GEMINI_QUESTION_GENERATION_ENABLED:true}

# Optional real Whisper transcription service (faster-whisper container included in the project).
ai.whisper.url=${AI_WHISPER_URL:}
ai.whisper.enabled=${AI_WHISPER_ENABLED:false}

app.frontend.base-url=${APP_FRONTEND_BASE_URL:http://127.0.0.1:5500}

# Google OAuth2 is optional. Enable the "oauth" profile only after setting client credentials.
app.oauth2.google.enabled=${GOOGLE_OAUTH_ENABLED:false}

# Default admin bootstrap account. Created automatically on first startup ONLY if
# no ADMIN-role user exists yet (see AdminAccountSeeder). Change these before any
# non-local deployment, or change the password immediately after first login.
app.admin.default-email=${ADMIN_DEFAULT_EMAIL:admin@smarthire.com}
app.admin.default-password=${ADMIN_DEFAULT_PASSWORD:Admin@12345}
app.admin.default-name=${ADMIN_DEFAULT_NAME:SmartHire Admin}
