<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SmartHire AI — Reset Password</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/login-theme.css"></head><body><main class="auth-shell"><section class="auth-card"><h1>Reset your SmartHire password</h1><p>Enter a new password for your account.</p><form id="resetForm"><label>New password<input id="newPassword" type="password" minlength="6" required></label><label>Confirm password<input id="confirmPassword" type="password" minlength="6" required></label><button class="primary-btn" type="submit">Reset Password</button><p id="resetMessage" role="alert"></p></form></section></main><script src="../js/api-client.js"></script><script>(async()=>{const q=new URLSearchParams(location.search),token=q.get('token');const form=document.getElementById('resetForm'),msg=document.getElementById('resetMessage');if(!token){form.style.display='none';msg.textContent='This reset link is invalid or expired.';return;}form.addEventListener('submit',async e=>{e.preventDefault();const a=document.getElementById('newPassword').value,b=document.getElementById('confirmPassword').value;if(a!==b){msg.textContent='Passwords do not match.';return;}try{await window.smartHireApi.requestJson('/api/auth/reset-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,newPassword:a})});msg.textContent='Password reset successfully. You can now log in.';form.style.display='none';}catch(err){msg.textContent=err.message||'Unable to reset password.';}});})();</script></body></html>
