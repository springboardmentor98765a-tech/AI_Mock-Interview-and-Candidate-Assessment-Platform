<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SmartHire AI - Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <!-- Logo -->
            <div class="auth-logo">
                SmartHire <span>AI</span>
            </div>

            <h1>Welcome Back</h1>

            <p class="auth-subtitle">
                Sign in to your SmartHire AI account
            </p>


            <!-- Login Form -->
            <form id="loginForm">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required
                >


                <div class="remember-row">

                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">
                        Forgot password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="primary-btn auth-btn"
                >
                    Sign In
                </button>

            </form>


            <p class="auth-footer">
                Don't have an account?
                <a href="signup.html">Create an account</a>
            </p>

        </div>

    </div>


    <script src="js/script.js"></script>

</body>

</html>
