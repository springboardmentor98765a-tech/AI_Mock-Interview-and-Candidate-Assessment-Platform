name: SmartHire CI

on:
  push:
    branches: ["main", "master", "develop"]
  pull_request:
    branches: ["main", "master", "develop"]

jobs:
  backend-build-test-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SmartHireFinal/smarthire-backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Build and test
        run: mvn -B clean test

      - name: Package
        run: mvn -B -DskipTests package

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smarthire-backend-jar
          path: SmartHireFinal/smarthire-backend/target/*.jar
