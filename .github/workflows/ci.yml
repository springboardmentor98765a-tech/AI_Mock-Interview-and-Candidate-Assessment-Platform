name: SmartHire CI

on:
  push:
    branches: ["main", "master", "develop", "**"]
  pull_request:

jobs:
  backend-build-test-package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: smarthire-backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Build and test
        run: mvn -B clean test
      - name: Package
        run: mvn -B -DskipTests package
      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: smarthire-backend-jar
          path: smarthire-backend/target/*.jar

  frontend-and-ai-sanity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: JavaScript syntax checks
        shell: bash
        run: |
          set -e
          for file in $(find js -type f -name '*.js'); do node --check "$file"; done
      - name: Python syntax checks
        shell: bash
        run: |
          python -m compileall -q ai-services
