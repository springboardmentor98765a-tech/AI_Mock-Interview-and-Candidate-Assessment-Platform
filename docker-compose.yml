version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: smarthire-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-smarthire}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - smarthire_pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./smarthire-backend/smarthire-backend
      dockerfile: Dockerfile
    container_name: smarthire-backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-smarthire}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-*}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-smarthire-secret-key-smarthire-secret-key-123456}
      APP_JWT_EXPIRATION_MS: ${APP_JWT_EXPIRATION_MS:-86400000}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smarthire-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  smarthire_pgdata:
