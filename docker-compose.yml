services:
  smarthire-ai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smarthire-ai-app
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    volumes:
      - ./backend/data:/app/backend/data
      - ./backend/storage:/app/backend/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
