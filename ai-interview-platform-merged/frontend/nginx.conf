server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Clean URLs: /login resolves to /login.html, /candidate resolves to
    # /candidate.html, etc. — matches the behavior of `npx serve` that
    # this project was originally developed against, so typed/bookmarked
    # extensionless URLs (and the browser's own /login/ redirect handling)
    # keep working the same way under nginx.
    location / {
        # Strip a single trailing slash (e.g. /login/ -> /login) before
        # falling through to the .html lookup below, so both /login and
        # /login/ resolve to login.html instead of the slash form 404ing.
        rewrite ^/(.+)/$ /$1 permanent;
        try_files $uri $uri.html $uri/ =404;
    }
}