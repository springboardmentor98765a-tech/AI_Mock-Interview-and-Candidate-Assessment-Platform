name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Node backend tests (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm install
      - run: npm test

  python-tests:
    name: Python AI service tests (Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: pytest tests/ -v

  docker-build:
    name: Docker images build
    runs-on: ubuntu-latest
    needs: [backend-tests, python-tests]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ai-interview-backend ./backend
      - run: docker build -t ai-interview-backend-python ./backend-python
      - run: docker build -t ai-interview-frontend ./frontend
