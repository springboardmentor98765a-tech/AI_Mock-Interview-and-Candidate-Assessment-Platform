<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SmartHire AI</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>



<section class="hero">

<h1>AI Mock Interview Platform</h1>

<p>

Choose your role to continue

</p>

</section>

<section class="roles">


    <!-- Candidate -->

<div class="role-card" onclick="openModal('Candidate')">
    <div class="icon">
        <i class="fa-solid fa-user-graduate"></i>
    </div>

    <h2>Candidate</h2>

</div>

    <!-- Recruiter -->

<div class="role-card" onclick="openModal('Recruiter')">
    <div class="icon">
        <i class="fa-solid fa-briefcase"></i>
    </div>

    <h2>Recruiter</h2>

</div>

    <!-- Admin -->
<div class="role-card" onclick="openModal('Admin')">
    <div class="icon">
        <i class="fa-solid fa-user-shield"></i>
    </div>

    <h2>Admin</h2>

</div>
</section>
<footer>
   <p> SmartHire AI © 2026</p>
</footer>

<!-- Login/Register Modal -->
<div id="loginModal" class="modal">

    <div class="modal-content">

        <span class="close" onclick="closeModal()">&times;</span>

        <h2 id="roleTitle">Login</h2>

        <!-- Login Form -->
        <div id="loginForm">

            <input type="email" id="loginEmail" placeholder="Email">

            <input type="password" id="loginPassword" placeholder="Password">

          <button onclick="handleLogin()">Login</button>


<hr>
<p style="margin:10px 0;color:#888;">or</p>
<button
    type="button"
    style="background:#fff;color:#444;border:1px solid #ccc;"
    onclick="window.location.href='http://127.0.0.1:8000/auth/google?role=' + selectedRole">
    Continue with Google
</button>

<p>
    Don't have an account?
    <a href="#" onclick="showRegister(); return false;">Register</a>
</p>
            

        </div>

        <!-- Register Form -->
        <div id="registerForm" style="display:none;">

            <input type="text" id="regName" placeholder="Full Name">

            <input type="email" id="regEmail" placeholder="Email">

            <input type="password" id="regPassword" placeholder="Password">

            <input type="password" id="regConfirmPassword" placeholder="Confirm Password">

        <button onclick="handleRegister()">Register</button>
            <p>
                Already have an account?
                <a href="#" onclick="showLogin(); return false;">Login</a>
            </p>

        </div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
