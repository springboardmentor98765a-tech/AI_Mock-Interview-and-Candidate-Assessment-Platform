<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Deep Obsidian Midnight -->
    <linearGradient id="sh-logo-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E0F2B" />
      <stop offset="50%" stop-color="#151740" />
      <stop offset="100%" stop-color="#060714" />
    </linearGradient>

    <!-- Outer Rim Glow Gradient -->
    <linearGradient id="sh-rim-grad" x1="2" y1="2" x2="62" y2="62" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C7D2FE" stop-opacity="0.95" />
      <stop offset="30%" stop-color="#818CF8" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#06B6D4" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.95" />
    </linearGradient>

    <!-- Inner Squircle Inset Bevel -->
    <linearGradient id="sh-bevel-grad" x1="6" y1="6" x2="58" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.2" />
    </linearGradient>

    <!-- Headset Metallic Arc Gradient -->
    <linearGradient id="sh-headset-grad" x1="14" y1="14" x2="50" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#A5B4FC" />
      <stop offset="40%" stop-color="#6366F1" />
      <stop offset="80%" stop-color="#0891B2" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Headset Top Bevel Light Shimmer -->
    <linearGradient id="sh-shimmer" x1="20" y1="16" x2="44" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1" />
    </linearGradient>

    <!-- Waveform Gradient -->
    <linearGradient id="sh-wave-grad" x1="20" y1="20" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Center Pillar Radiant Gradient -->
    <linearGradient id="sh-center-pillar" x1="32" y1="19" x2="32" y2="47" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#E0E7FF" />
      <stop offset="100%" stop-color="#67E8F9" />
    </linearGradient>

    <!-- S-Ribbon Gradient -->
    <linearGradient id="sh-s-grad" x1="22" y1="20" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#E0E7FF" />
      <stop offset="70%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="sh-glow-filter" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="1.6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Layer 1: Premium Squircle Shield Base with Double Inset Bevel -->
  <rect x="5" y="5" width="54" height="54" rx="16" fill="url(#sh-logo-bg)" />
  <rect x="5.5" y="5.5" width="53" height="53" rx="15.5" stroke="url(#sh-rim-grad)" stroke-width="1.8" />
  <rect x="7.5" y="7.5" width="49" height="49" rx="13.5" stroke="url(#sh-bevel-grad)" stroke-width="1" />

  <!-- Layer 2: Vision & Attention Telemetry Orbit Ring with 4-Axis Focus Ticks -->
  <circle cx="32" cy="32" r="23" stroke="#6366F1" stroke-width="1" stroke-dasharray="2 6" stroke-opacity="0.35" />
  <line x1="32" y1="7.5" x2="32" y2="10" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
  <line x1="32" y1="54" x2="32" y2="56.5" stroke="#06B6D4" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
  <line x1="7.5" y1="32" x2="10" y2="32" stroke="#818CF8" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />
  <line x1="54" y1="32" x2="56.5" y2="32" stroke="#06B6D4" stroke-width="1.5" stroke-linecap="round" opacity="0.7" />

  <!-- Radial Core Luminescence Aura -->
  <circle cx="32" cy="28" r="17" fill="#4F46E5" fill-opacity="0.18" />

  <!-- Layer 3: AI Interview Headset Arc with Specular Reflection -->
  <path d="M16 33.5 C16 24.1 23.2 16.5 32 16.5 C40.8 16.5 48 24.1 48 33.5" stroke="url(#sh-headset-grad)" stroke-width="3.2" stroke-linecap="round" />
  <path d="M24 17.2 C26.5 16.6 29.2 16.5 32 16.5 C34.8 16.5 37.5 16.6 40 17.2" stroke="url(#sh-shimmer)" stroke-width="1.4" stroke-linecap="round" />

  <!-- Layer 4: Ergonomic Earcups with High-Precision Dual Insets -->
  <rect x="13" y="29" width="5.8" height="11.5" rx="2.9" fill="#3730A3" stroke="#818CF8" stroke-width="1.2" />
  <rect x="14.5" y="32" width="2.8" height="5.5" rx="1.4" fill="#6366F1" />

  <rect x="45.2" y="29" width="5.8" height="11.5" rx="2.9" fill="#0E7490" stroke="#67E8F9" stroke-width="1.2" />
  <rect x="46.7" y="32" width="2.8" height="5.5" rx="1.4" fill="#06B6D4" />

  <!-- Layer 5: Microphone Boom & Radiant Concentric Voice Capsule -->
  <path d="M48 38 C48 45.8 39.8 48.8 34.5 48.8 H31.5" stroke="#06B6D4" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="30" cy="48.8" r="3.2" fill="#0891B2" />
  <circle cx="30" cy="48.8" r="2.2" fill="#38BDF8" />
  <circle cx="30" cy="48.8" r="1.1" fill="#FFFFFF" />

  <!-- Layer 6: Speech Frequency Equalizer Pillars (Voice Pacing & Articulation) -->
  <rect x="21" y="28" width="2.6" height="10" rx="1.3" fill="url(#sh-wave-grad)" opacity="0.85" />
  <rect x="26" y="23" width="2.6" height="20" rx="1.3" fill="url(#sh-wave-grad)" />
  <rect x="30.7" y="19" width="2.6" height="28" rx="1.3" fill="url(#sh-center-pillar)" filter="url(#sh-glow-filter)" />
  <rect x="35.4" y="23" width="2.6" height="20" rx="1.3" fill="url(#sh-wave-grad)" />
  <rect x="40.4" y="28" width="2.6" height="10" rx="1.3" fill="url(#sh-wave-grad)" opacity="0.85" />

  <!-- Layer 7: Dynamic "S" Neural Trajectory Ribbon with Career Ascent Arrow Tip -->
  <path d="M22 26.5 C22 21.8 30.5 20.8 34.5 23.8 C38.5 26.8 36 31.5 31 33.5 C25.5 35.5 23.8 40.5 28.5 43.2 C33 45.8 40 43.2 42.5 37.5" 
        stroke="url(#sh-s-grad)" stroke-width="2.7" stroke-linecap="round" fill="none" filter="url(#sh-glow-filter)" />
  <path d="M40 37.5 L43 37 L43 40" stroke="#38BDF8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Layer 8: Top AI Intelligence Faceted Diamond Crown (Scoring & Telemetry Apex) -->
  <path d="M32 7 L33.6 11 L37.6 12.6 L33.6 14.2 L32 18.2 L30.4 14.2 L26.4 12.6 L30.4 11 Z" fill="#38BDF8" filter="url(#sh-glow-filter)" />
  <circle cx="32" cy="12.6" r="1.6" fill="#FFFFFF" />

  <!-- Layer 9: 4 Corner Cybernetic HUD Alignment Pins -->
  <circle cx="10" cy="10" r="1.1" fill="#C7D2FE" opacity="0.6" />
  <circle cx="54" cy="10" r="1.1" fill="#38BDF8" opacity="0.6" />
  <circle cx="10" cy="54" r="1.1" fill="#818CF8" opacity="0.6" />
  <circle cx="54" cy="54" r="1.1" fill="#06B6D4" opacity="0.6" />
</svg>
