<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Signing you in...</title>
</head>
<body>
<p>Signing you in with Google...</p>

<script>
const params = new URLSearchParams(window.location.search);

const token = params.get("token");
const name = params.get("name");
const role = params.get("role");
const email = params.get("email");

if (token) {
    localStorage.setItem("token", token);
    localStorage.setItem("user", JSON.stringify({ name, role, email }));

    const roleLower = role.toLowerCase();

    if (roleLower === "candidate") window.location.href = "Candidate.html";
    else if (roleLower === "recruiter") window.location.href = "Recruiter.html";
    else if (roleLower === "admin") window.location.href = "Admin.html";
    else window.location.href = "index.html";
} else {
    alert("Google sign-in failed");
    window.location.href = "index.html";
}
</script>
</body>
</html>
